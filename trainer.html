<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trainer · Oncology Navigator · AiM One Health</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="site.css">
<script src="flip.js"></script>
<style>
  .t-hero { padding: clamp(44px, 6vw, 80px) 0 24px; }
  .t-hero h1 { font-size: clamp(32px, 4.6vw, 54px); margin: 14px 0 12px; max-width: 24ch; }
  .t-theme { font: 600 clamp(17px, 1.6vw, 20px)/1.45 var(--font-head); color: var(--accent); }
  .t-meta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
  .t-meta .badge { max-width: 100%; white-space: normal; line-height: 1.35; overflow-wrap: anywhere; }
  .t-meta .badge.std { text-transform: none; letter-spacing: 0; font-weight: 600; }
  .t-top { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 24px; align-items: end; }
  .t-actions { display: flex; flex-wrap: wrap; gap: 10px; }
  .viewsw { display: inline-flex; padding: 4px; border-radius: 999px; background: rgb(13 40 70 / .06); }
  :root[data-theme='night'] .viewsw { background: rgb(255 255 255 / .06); }
  .viewsw button { border: 0; cursor: pointer; padding: 10px 18px; border-radius: 999px; font: 600 14.5px/1 var(--font-body); color: var(--ink-2); background: transparent; }
  .viewsw button.on { background: var(--glass-strong); color: var(--brand); box-shadow: var(--shadow), inset 0 1px 0 var(--glass-edge-1); }
  .t-sec { padding: 0 0 clamp(36px, 5vw, 56px); scroll-margin-top: 90px; }
  .t-sec > h2 { font-size: clamp(25px, 2.6vw, 32px); margin: 8px 0 8px; }
  .t-sec > .muted { margin-bottom: 18px; }
  .t-nav { position: sticky; top: 92px; z-index: 6; display: flex; gap: 6px; overflow-x: auto; padding: 8px; border-radius: 999px; margin-bottom: 30px; scrollbar-width: none; }
  .t-nav::-webkit-scrollbar { display: none; }
  .t-nav a { flex: none; padding: 9px 16px; border-radius: 999px; font: 600 14.5px/1 var(--font-body); color: var(--ink-2); text-decoration: none; }
  .t-nav a:hover, .t-nav a.on { background: var(--glass-strong); color: var(--brand); }
  /* journey */
  .journey { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
  .journey .tile { padding: 20px; }
  .journey .tile b.n { font: 800 13px/1 var(--font-head); color: var(--accent); letter-spacing: .08em; text-transform: uppercase; }
  .journey .tile h3 { font-size: 18px; }
  .journey .tile p { font-size: 15px; }
  /* case wizard */
  .wizard { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 20px; }
  .steps { display: grid; gap: 6px; align-content: start; padding: 12px; border-radius: 24px; }
  .steps button { display: flex; gap: 12px; align-items: center; text-align: left; border: 0; cursor: pointer; padding: 12px 14px; border-radius: 14px; font: 600 15px/1.3 var(--font-body); color: var(--ink-2); background: transparent; }
  .steps button i { flex: none; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font: 800 12px/1 var(--font-head); font-style: normal; color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); }
  .steps button.on { background: var(--glass-strong); color: var(--brand); box-shadow: inset 0 0 0 1px var(--glass-edge-2); }
  .steps button.on i { color: #fff; background: linear-gradient(135deg, #0b2e59, #0a6f79); }
  .step-panel { padding: clamp(22px, 3vw, 32px); border-radius: 26px; }
  .step-panel h3 { font-size: 22px; margin-bottom: 4px; }
  .fields { display: grid; gap: 20px; margin-top: 18px; }
  .fq label.lbl { display: flex; justify-content: space-between; gap: 10px; font: 600 15.5px/1.3 var(--font-body); color: var(--ink); }
  .fq label.lbl output { color: var(--accent); font-variant-numeric: tabular-nums; }
  .fq .help { margin-top: 6px; font-size: 14px; color: var(--ink-3); line-height: 1.5; }
  .fq input[type=range] { width: 100%; margin-top: 10px; accent-color: var(--accent); }
  .seg { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .seg button { border: 0; cursor: pointer; padding: 9px 14px; border-radius: 12px; font: 600 14px/1.2 var(--font-body); color: var(--ink-2); background: var(--glass-strong); box-shadow: inset 0 0 0 1px var(--glass-edge-2); }
  .seg button.on { color: #fff; background: var(--brand); box-shadow: none; }
  :root[data-theme='night'] .seg button.on { color: #03141c; background: var(--accent); }
  .fq select.input { margin-top: 10px; }
  .step-foot { display: flex; justify-content: space-between; gap: 10px; margin-top: 24px; }
  /* options */
  .tabs2 { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 14px; color: var(--ink-2); margin-bottom: 14px; }
  .opts { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(340px, 100%), 1fr)); gap: 14px; }
  .opt { display: flex; flex-direction: column; gap: 10px; padding: 22px; border-radius: 22px; }
  .opt.no { opacity: .55; }
  .opt .head { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
  .opt h3 { font-size: 18.5px; line-height: 1.3; }
  .fit { flex: none; font: 700 12px/1 var(--font-body); padding: 6px 10px; border-radius: 999px; white-space: nowrap; }
  .fit.yes { color: var(--ok); background: color-mix(in srgb, var(--ok) 13%, transparent); }
  .fit.no { color: var(--warm); background: color-mix(in srgb, var(--warm) 12%, transparent); }
  .fit.maybe { color: var(--ink-2); background: rgb(13 40 70 / .07); }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 14.5px; }
  .kv dt { color: var(--ink-3); font-weight: 600; }
  .kv dd { margin: 0; color: var(--ink); }
  .burden { display: inline-flex; gap: 3px; vertical-align: middle; }
  .burden i { width: 9px; height: 9px; border-radius: 50%; background: rgb(13 40 70 / .12); }
  :root[data-theme='night'] .burden i { background: rgb(255 255 255 / .14); }
  .burden i.on { background: var(--warm); }
  .drugs { display: flex; flex-wrap: wrap; gap: 6px; }
  .drugs span { font-size: 12.5px; font-weight: 600; padding: 4px 9px; border-radius: 8px; background: color-mix(in srgb, var(--accent-2) 10%, transparent); color: var(--accent-2); }
  .outcome { padding: 10px 12px; border-radius: 12px; font-size: 14.5px; background: color-mix(in srgb, var(--accent) 7%, transparent); }
  .outcome b { color: var(--brand); }
  .rule { font: 500 12.5px/1.4 ui-monospace, Consolas, monospace; color: var(--ink-3); word-break: break-word; }
  body.patient-view .clin-only { display: none; }
  body:not(.patient-view) .pat-only { display: none; }
  /* milestones, trials, library */
  .ms .card ul { margin: 10px 0 0; padding-left: 20px; color: var(--ink-2); font-size: 15px; }
  .ms .card li + li { margin-top: 4px; }
  .ms .when { font: 700 12.5px/1 var(--font-body); letter-spacing: .08em; text-transform: uppercase; color: var(--accent); margin-bottom: 6px; display: block; }
  .trials { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(300px, 100%), 1fr)); gap: 14px; }
  .trial { padding: 20px; border-radius: 20px; display: flex; flex-direction: column; gap: 8px; }
  .trial h3 { font-size: 17px; line-height: 1.3; }
  .trial a { font-weight: 700; font-size: 14.5px; }
  .lists { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .lists .glass { padding: 24px; border-radius: 24px; }
  .lists ol, .lists ul { margin: 12px 0 0; padding-left: 20px; color: var(--ink-2); font-size: 15px; }
  .lists li + li { margin-top: 8px; }
  .lib-tools { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }
  .lib-tools .search { flex: 1; min-width: min(260px, 100%); }
  .lib { display: grid; gap: 8px; }
  .lib a { display: flex; gap: 14px; align-items: baseline; padding: 12px 16px; border-radius: 14px; text-decoration: none; color: var(--ink); background: var(--glass); box-shadow: inset 0 0 0 1px var(--glass-edge-2); font-size: 15px; }
  .lib a span { flex: 0 1 auto; max-width: 34%; font-size: 12px; font-weight: 700; color: var(--ink-3); min-width: 74px; text-transform: uppercase; letter-spacing: .04em; overflow-wrap: anywhere; }
  /* long words and source names in the data must never push the page sideways */
  .t-sec, .opt, .trial, .ms .card, .lists .glass, .step-panel { min-width: 0; overflow-wrap: anywhere; }
  .opt .head h3 { min-width: 0; }
  #app { overflow-wrap: anywhere; }
  @media (max-width: 640px) { .lib a { flex-direction: column; gap: 4px; } .lib a span { max-width: none; } .fit { white-space: normal; } }
  .lib a:hover { color: var(--accent); }
  .help-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
  .loading { padding: 80px 0; text-align: center; color: var(--ink-2); }
  @media (max-width: 980px) { .t-top, .wizard, .lists { grid-template-columns: minmax(0, 1fr); } .steps { grid-auto-flow: column; overflow-x: auto; } .steps button { white-space: nowrap; } .t-nav { top: 84px; } }
  @media print { .site-head, .rail, .mock-note, .t-nav, .notice, .site-foot, .t-actions { display: none !important; } .glass { box-shadow: none !important; background: #fff !important; } }
</style>
</head>
<body data-page="navigator.html">
<main id="main"><div class="loading" id="loading">Loading trainer…</div><div id="app" hidden></div></main>
<script src="site.js"></script>
<script>
(() => {
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  const title = (c) => c.toLowerCase().replace(/(^|[\s&,/-]+)(\w)/g, (m) => m.toUpperCase()).replace(/\bGi\b/, 'GI').replace(/\bGu\b/, 'GU').replace(/\bCns\b/, 'CNS');
  const page = new URLSearchParams(location.search).get('t') || 'gbm';
  const app = document.getElementById('app');

  // ---- eligibility rules from the spec, e.g. "mgmt=='methylated' && age<=70" ----
  // A tiny parser (no eval): ==, !=, <, <=, >, >=, &&, ||, parentheses, true/false.
  // Three-valued: true, false, or null when an input it needs isn't part of this case.
  function evaluate(expr, vals) {
    if (!expr) return true;
    const toks = String(expr).match(/\s*(\|\||&&|==|!=|<=|>=|<|>|\(|\)|'[^']*'|"[^"]*"|-?\d+(?:\.\d+)?|[A-Za-z_][\w.]*)\s*/g);
    if (!toks || toks.join('').replace(/\s/g, '') !== String(expr).replace(/\s/g, '')) return null;
    const t = toks.map((x) => x.trim());
    let i = 0;
    const peek = () => t[i], next = () => t[i++];
    const value = () => {
      const x = next();
      if (x === '(') { const v = or(); next(); return { v }; }
      if (x === 'true' || x === 'false') return { v: x === 'true' };
      if (/^['"]/.test(x)) return { lit: x.slice(1, -1) };
      if (/^-?\d/.test(x)) return { lit: Number(x) };
      return { ref: x };
    };
    const cmp = () => {
      const a = value();
      if (['==', '!=', '<', '<=', '>', '>='].includes(peek())) {
        const op = next(), b = value();
        const get = (o) => (o.ref !== undefined ? (o.ref in vals ? vals[o.ref] : undefined) : o.lit);
        const x = get(a), y = get(b);
        if (x === undefined || y === undefined) return null;
        const n = (q) => (typeof q === 'number' ? q : isNaN(Number(q)) ? q : Number(q));
        switch (op) {
          case '==': return String(x) === String(y);
          case '!=': return String(x) !== String(y);
          case '<': return n(x) < n(y);
          case '<=': return n(x) <= n(y);
          case '>': return n(x) > n(y);
          case '>=': return n(x) >= n(y);
        }
      }
      if (a.v !== undefined) return a.v;
      if (a.ref !== undefined) return a.ref in vals ? Boolean(vals[a.ref]) : null;
      return Boolean(a.lit);
    };
    const and = () => { let r = cmp(); while (peek() === '&&') { next(); const b = cmp(); r = r === false || b === false ? false : r === null || b === null ? null : true; } return r; };
    const or = () => { let r = and(); while (peek() === '||') { next(); const b = and(); r = r === true || b === true ? true : r === null || b === null ? null : false; } return r; };
    try { const r = or(); return i === t.length ? r : null; } catch { return null; }
  }

  fetch(`trainers/${encodeURIComponent(page)}.json`).then((r) => { if (!r.ok) throw new Error(); return r.json(); }).then(render).catch(() => {
    document.getElementById('loading').innerHTML = 'This trainer could not be loaded. <a href="navigator.html">Back to the Navigator</a>';
  });

  function render(d) {
    document.title = `${d.name} · Oncology Navigator · AiM One Health`;
    const groups = Object.entries(d.inputs).filter(([, l]) => l.length);
    const vals = {};
    groups.forEach(([, l]) => l.forEach((f) => { vals[f.id] = f.def ?? (f.options ? f.options[0] : f.min ?? null); }));
    const settings = Object.keys(d.arms);
    let step = 0, setting = settings[0];
    const pretty = (s) => String(s).replace(/_/g, ' ');
    const short = (s, n) => (String(s).length > n ? String(s).slice(0, n).replace(/\s+\S*$/, '') + '…' : String(s));

    app.innerHTML = `
      <section class="t-hero"><div class="wrap">
        <nav class="crumbs" aria-label="Breadcrumb"><a href="navigator.html">Oncology Navigator</a><span>›</span><span>${esc(title(d.category))}</span></nav>
        <div class="t-top" style="margin-top:18px">
          <div>
            <span class="badge">${esc(title(d.category))}</span>
            <h1>${esc(d.name)}</h1>
            <p class="t-theme">${esc(d.theme)}</p>
            <div class="t-meta"><span class="badge plain">${esc(d.meta.version)}</span><span class="badge plain">Verified ${esc(d.meta.verified)}</span><span class="badge ok"><span class="dot"></span> Gate passed · ${d.props} properties</span>${d.meta.classification ? `<span class="badge plain std">${esc(d.meta.classification)}</span>` : ''}${d.meta.response ? `<span class="badge plain std">${esc(d.meta.response)}</span>` : ''}</div>
          </div>
          <div class="t-actions">
            <div class="viewsw" role="tablist" aria-label="View"><button class="on" data-view="clin" role="tab">Clinician view</button><button data-view="pat" role="tab">Patient &amp; caregiver</button></div>
          </div>
        </div>
        <div class="note-box glass strong" style="margin-top:24px"><span class="ico sm" data-ico="shield"></span><p><b style="color:var(--ink)">${esc(d.meta.disclaimer || 'Synthetic patient. Training only. Not medical advice.')}</b> ${esc(d.meta.condition || '')}${d.meta.population ? ` · ${esc(short(d.meta.population, 140))}` : ''}</p></div>
      </div></section>

      <div class="wrap">
        <nav class="t-nav glass strong" id="tnav">
          <a href="#overview" class="on">Overview</a><a href="#case">Your case</a><a href="#options">Options</a><a href="#road">The road ahead</a><a href="#trials">Trials</a><a href="#safety">Safety &amp; honesty</a><a href="#library">Research library</a>
        </nav>

        <section class="t-sec" id="overview">
          <span class="eyebrow">Overview</span><h2>How this trainer works</h2>
          <p class="muted read">${esc(d.meta.summary || '')}</p>${d.meta.population && d.meta.population.length > 140 ? `<details class="glass" style="margin-top:14px;padding:0 20px;border-radius:16px"><summary style="padding:14px 0;cursor:pointer;font-weight:700;color:var(--brand)">Who this trainer covers</summary><p class="small muted" style="padding-bottom:16px">${esc(d.meta.population)}</p></details>` : ''}
          <div class="facts" style="margin-top:18px">
            <div class="stat glass"><b>${Object.values(d.arms).flat().length}</b><span>Modeled options</span></div>
            <div class="stat glass"><b>${groups.reduce((n, [, l]) => n + l.length, 0)}</b><span>Case inputs</span></div>
            <div class="stat glass"><b>${d.trials.length}</b><span>Clinical trials</span></div>
            <div class="stat glass"><b>${d.refs.length}</b><span>Sources</span></div>
            <div class="stat glass"><b>${d.honesty.length}</b><span>Honesty rules</span></div>
          </div>
          ${d.stages.length ? `<h3 style="margin:8px 0 12px">The decision journey</h3><div class="journey">${d.stages.map((s, i) => `<div class="tile glass"><b class="n">Step ${i + 1} · ${esc(s.label)}</b><h3>${esc(s.question)}</h3><p>${esc(s.decision)}</p></div>`).join('')}</div>` : ''}
        </section>

        <section class="t-sec" id="case">
          <span class="eyebrow">Your case</span><h2>Describe the synthetic patient</h2>
          <p class="muted read">Step through the details. As you change them, each option below shows whether it fits this case, using the trainer's own eligibility rules.</p>
          <div class="wizard">
            <div class="steps glass" id="steps">${groups.map(([g], i) => `<button data-s="${i}"><i>${i + 1}</i>${esc(g)}</button>`).join('')}</div>
            <div class="step-panel glass bloom" id="panel"></div>
          </div>
        </section>

        <section class="t-sec" id="options">
          <span class="eyebrow">Options</span><h2>Modeled treatment options</h2>
          <p class="muted read clin-only">Each option with its guideline status, evidence, burden and teaching-model outcome. The live trainer ranks them for the case; here they're grouped by whether they fit.</p>
          <p class="muted read pat-only">These are the paths a care team might discuss. “Fits this case” means the details you entered meet that option's basic requirements. It is not a recommendation.</p>
          ${settings.length > 1 ? `<div class="tabs2 chips" id="settings">${settings.map((s) => `<button class="chip${s === setting ? ' on' : ''}" data-set="${esc(s)}">${esc(s)} <span class="n">${d.arms[s].length}</span></button>`).join('')}</div>` : ''}
          <div class="legend"><span><span class="fit yes">Fits this case</span></span><span><span class="fit maybe">Depends on details not entered</span></span><span><span class="fit no">Doesn't fit this case</span></span></div>
          <div class="opts" id="opts"></div>
        </section>

        <section class="t-sec ms" id="road">
          <span class="eyebrow">The road ahead</span><h2>Clinical milestones</h2>
          <p class="muted read">The checkpoints along the way, and what the team reviews at each.</p>
          <div class="thread">${d.milestones.map((m, i) => `<div class="step"><span class="num">${i + 1}</span><div class="card glass"><span class="when">${esc(m.window || m.id)}</span><h3>${esc(m.title)}</h3>${m.trigger ? `<p>${esc(m.trigger)}</p>` : ''}${m.review.length ? `<ul>${m.review.map((r) => `<li>${esc(r)}</li>`).join('')}</ul>` : ''}</div></div>`).join('') || '<p class="muted">No milestones in this trainer.</p>'}</div>
          ${d.surveillance.length ? `<h3 style="margin:26px 0 12px">Follow-up schedule</h3><div class="help-row">${d.surveillance.map((s) => `<div class="tile glass"><h3 style="font-size:17px">${esc(s.phase)}</h3><p>${esc(s.cadence)}</p></div>`).join('')}</div>` : ''}
        </section>

        <section class="t-sec" id="trials">
          <span class="eyebrow">Clinical trials</span><h2>Trials this trainer tracks</h2>
          <div class="trials">${d.trials.map((t) => `<div class="trial glass"><div style="display:flex;gap:8px;flex-wrap:wrap">${t.phase ? `<span class="badge plain">Phase ${esc(t.phase)}</span>` : ''}<span class="badge ${t.closed ? 'warm' : 'ok'}">${t.closed ? 'Closed' : esc(t.status || 'Open')}</span></div><h3>${esc(t.name)}</h3>${t.setting ? `<p class="small muted">Setting: ${esc(pretty(t.setting))}</p>` : ''}${t.nct ? `<a href="https://clinicaltrials.gov/study/${esc(t.nct)}">${esc(t.nct)} ↗</a>` : ''}</div>`).join('') || '<p class="muted">No trials listed.</p>'}</div>
        </section>

        <section class="t-sec" id="safety">
          <span class="eyebrow">Safety &amp; honesty</span><h2>The rules this trainer never breaks</h2>
          <div class="lists">
            <div class="glass"><h3>Honesty rules</h3><ol>${d.honesty.map((h) => `<li>${esc(h)}</li>`).join('')}</ol></div>
            <div class="glass"><h3>Safety gates</h3><ul class="checks" style="padding:0">${d.gates.map((g) => `<li>${esc(g)}</li>`).join('')}</ul>${d.care.length ? `<h3 style="margin-top:22px">Where care has to happen</h3><ul>${d.care.map((c) => `<li>${esc(c)}</li>`).join('')}</ul>` : ''}</div>
          </div>
        </section>

        <section class="t-sec" id="library">
          <span class="eyebrow">Research library</span><h2>Every source in this trainer</h2>
          <div class="lib-tools"><label class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input class="input" id="libq" placeholder="Search ${d.refs.length} sources" aria-label="Search sources"></label><div class="chips" id="libg"></div></div>
          <div class="lib" id="lib"></div>
        </section>

        <section class="t-sec">
          <div class="help-row">
            <a class="tile glass lift" href="request.html" style="text-decoration:none"><span class="ico" data-ico="stethoscope"></span><h3>Nurse navigator</h3><p>Talk the case through with a specialty nurse.</p></a>
            <a class="tile glass lift" href="research.html" style="text-decoration:none"><span class="ico" data-ico="flask"></span><h3>Tele-research</h3><p>Explore in-silico research cases.</p></a>
            <a class="tile glass lift" href="https://www.cancer.gov" style="text-decoration:none"><span class="ico" data-ico="heart"></span><h3>Advocacy groups</h3><p>Patient organizations and support.</p></a>
            <button class="tile glass lift" id="print" style="border:0;cursor:pointer;text-align:left;font:inherit;color:inherit"><span class="ico" data-ico="download"></span><h3>Print or save as PDF</h3><p>A copy of this trainer's summary.</p></button>
          </div>
          <div class="read-original glass" style="margin-top:20px"><p>This is the redesigned trainer in the mockup. The live trainer runs the full ranking engine, prognosis model and 1-minute debrief.</p><a class="btn primary sm inline" href="https://nav.onconavigator.ai/${esc(d.page)}.html">Open the live trainer ↗</a></div>
        </section>
      </div>`;
    document.querySelectorAll('#app [data-ico]').forEach((el) => (el.innerHTML = window.aimIcon(el.dataset.ico)));
    document.getElementById('loading').hidden = true;
    app.hidden = false;

    // view switch
    app.querySelectorAll('.viewsw button').forEach((b) => (b.onclick = () => {
      app.querySelectorAll('.viewsw button').forEach((x) => x.classList.toggle('on', x === b));
      document.body.classList.toggle('patient-view', b.dataset.view === 'pat');
      drawStep();
    }));

    // case wizard
    const panel = document.getElementById('panel');
    const drawStep = () => {
      const [g, fields] = groups[step];
      app.querySelectorAll('#steps button').forEach((b, i) => b.classList.toggle('on', i === step));
      const pat = document.body.classList.contains('patient-view');
      panel.innerHTML = `<span class="tiny">Step ${step + 1} of ${groups.length}</span><h3>${esc(g)}</h3>
        <div class="fields">${fields.map((f) => {
          const help = pat ? f.helpPatient || f.help : f.help;
          const lbl = esc(f.label.replace(/^\w/, (c) => c.toUpperCase()));
          if (f.type === 'range' || f.control === 'slider') return `<div class="fq"><label class="lbl" for="f-${f.id}">${lbl}<output>${esc(vals[f.id])}${f.unit ? ' ' + esc(f.unit) : ''}</output></label><input type="range" id="f-${f.id}" data-f="${f.id}" min="${f.min ?? 0}" max="${f.max ?? 100}" value="${esc(vals[f.id])}">${help ? `<p class="help">${esc(help)}</p>` : ''}</div>`;
          if (f.options && f.options.length > 6) return `<div class="fq"><label class="lbl" for="f-${f.id}">${lbl}</label><select class="input" id="f-${f.id}" data-f="${f.id}">${f.options.map((o) => `<option${String(vals[f.id]) === o ? ' selected' : ''} value="${esc(o)}">${esc(pretty(o))}</option>`).join('')}</select>${help ? `<p class="help">${esc(help)}</p>` : ''}</div>`;
          if (f.options) return `<div class="fq"><span class="lbl" style="display:block;font:600 15.5px/1.3 var(--font-body)">${lbl}</span><div class="seg" role="radiogroup">${f.options.map((o) => `<button role="radio" aria-checked="${String(vals[f.id]) === o}" class="${String(vals[f.id]) === o ? 'on' : ''}" data-f="${f.id}" data-v="${esc(o)}">${esc(pretty(o))}</button>`).join('')}</div>${help ? `<p class="help">${esc(help)}</p>` : ''}</div>`;
          return `<div class="fq"><span class="lbl" style="display:block;font:600 15.5px/1.3 var(--font-body)">${lbl}</span><div class="seg">${['no', 'yes'].map((o) => `<button class="${String(vals[f.id]) === o || (o === 'yes' && vals[f.id] === true) ? 'on' : ''}" data-f="${f.id}" data-v="${o}">${o}</button>`).join('')}</div>${help ? `<p class="help">${esc(help)}</p>` : ''}</div>`;
        }).join('')}</div>
        <div class="step-foot"><button class="btn ghost sm inline" id="prev"${step === 0 ? ' disabled' : ''}>← Back</button><button class="btn primary sm inline" id="nextb">${step === groups.length - 1 ? 'See the options ↓' : 'Next section →'}</button></div>`;
      panel.querySelectorAll('input[type=range]').forEach((r) => (r.oninput = () => {
        vals[r.dataset.f] = Number(r.value);
        const f = fields.find((x) => x.id === r.dataset.f);
        r.previousElementSibling.querySelector('output').textContent = r.value + (f?.unit ? ' ' + f.unit : '');
        drawOpts();
      }));
      panel.querySelectorAll('select[data-f]').forEach((s) => (s.onchange = () => { vals[s.dataset.f] = s.value; drawOpts(); }));
      panel.querySelectorAll('.seg button').forEach((b) => (b.onclick = () => { vals[b.dataset.f] = b.dataset.v; b.parentElement.querySelectorAll('button').forEach((x) => { x.classList.toggle('on', x === b); x.setAttribute('aria-checked', String(x === b)); }); drawOpts(); }));
      document.getElementById('prev').onclick = () => { step = Math.max(0, step - 1); drawStep(); };
      document.getElementById('nextb').onclick = () => { if (step < groups.length - 1) { step++; drawStep(); } else document.getElementById('options').scrollIntoView({ behavior: 'smooth' }); };
    };
    app.querySelectorAll('#steps button').forEach((b) => (b.onclick = () => { step = Number(b.dataset.s); drawStep(); }));

    // options
    const drawOpts = () => {
      const list = d.arms[setting].map((a) => ({ a, fit: evaluate(a.eligibility, vals) }));
      list.sort((x, y) => (y.fit === true) - (x.fit === true) || (x.fit === false) - (y.fit === false));
      document.getElementById('opts').innerHTML = list.map(({ a, fit }) => `
        <article class="opt glass${fit === false ? ' no' : ''}">
          <div class="head"><h3>${esc(a.name)}</h3><span class="fit ${fit === true ? 'yes' : fit === false ? 'no' : 'maybe'}">${fit === true ? 'Fits this case' : fit === false ? "Doesn't fit" : 'Depends'}</span></div>
          ${a.patient ? `<p class="small muted pat-only">${esc(a.patient)}</p>` : ''}
          <dl class="kv">
            ${a.intent ? `<dt>Goal</dt><dd>${esc(pretty(a.intent))}</dd>` : ''}
            ${a.guideline ? `<dt class="clin-only">Guideline</dt><dd class="clin-only">${esc(a.guideline)}</dd>` : ''}
            ${a.evidence ? `<dt class="clin-only">Evidence</dt><dd class="clin-only">${esc(a.evidence)}</dd>` : ''}
            ${a.burden != null ? `<dt>Burden</dt><dd><span class="burden" aria-label="Burden ${a.burden} of 5">${[1, 2, 3, 4, 5].map((n) => `<i class="${n <= a.burden ? 'on' : ''}"></i>`).join('')}</span></dd>` : ''}
            ${a.toxicity ? `<dt>Side effects</dt><dd>${esc(a.toxicity)}</dd>` : ''}
          </dl>
          ${a.outcome && a.outcome.value != null ? `<div class="outcome clin-only"><b>${esc(pretty(a.outcome.type || 'outcome'))}:</b> ${esc(a.outcome.value)} <span class="tiny">· teaching model</span></div>` : ''}
          ${a.drugs.length ? `<div class="drugs">${a.drugs.map((x) => `<span>${esc(x)}</span>`).join('')}</div>` : ''}
          ${a.eligibility && a.eligibility !== 'true' ? `<p class="rule clin-only">Requires: ${esc(a.eligibility)}</p>` : ''}
        </article>`).join('');
    };
    const st = document.getElementById('settings');
    if (st) st.onclick = (e) => { const b = e.target.closest('[data-set]'); if (!b) return; setting = b.dataset.set; st.querySelectorAll('.chip').forEach((x) => x.classList.toggle('on', x === b)); drawOpts(); };

    // research library
    const libGroups = ['All', ...new Set(d.refs.map((r) => r.group).filter(Boolean))];
    let lg = 'All';
    const libg = document.getElementById('libg');
    libg.innerHTML = libGroups.map((g) => `<button class="chip${g === 'All' ? ' on' : ''}" data-g="${esc(g)}">${esc(pretty(g))}</button>`).join('');
    const drawLib = () => {
      const q = document.getElementById('libq').value.trim().toLowerCase();
      const list = d.refs.filter((r) => (lg === 'All' || r.group === lg) && (!q || `${r.label} ${r.src}`.toLowerCase().includes(q)));
      document.getElementById('lib').innerHTML = list.map((r) => `<a href="${esc(r.url)}"><span>${esc(r.src || r.group || '')}</span>${esc(r.label)}</a>`).join('') || '<p class="muted">No sources match.</p>';
    };
    libg.onclick = (e) => { const b = e.target.closest('[data-g]'); if (!b) return; lg = b.dataset.g; libg.querySelectorAll('.chip').forEach((x) => x.classList.toggle('on', x === b)); drawLib(); };
    document.getElementById('libq').oninput = drawLib;
    document.getElementById('print').onclick = () => print();

    // section nav follows the scroll
    const navLinks = [...document.querySelectorAll('#tnav a')];
    const io = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) navLinks.forEach((a) => a.classList.toggle('on', a.getAttribute('href') === '#' + e.target.id)); }), { rootMargin: '-30% 0px -60% 0px' });
    document.querySelectorAll('.t-sec[id]').forEach((s) => io.observe(s));

    drawStep();
    drawOpts();
    drawLib();
  }
})();
</script>
</body>
</html>
